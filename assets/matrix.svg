<title id="t">Tech stack</title>
<desc id="d">Tech stack. languages: Python, TypeScript, JavaScript, C++, Java. ai / ml: Agentic AI, PyTorch, Federated Learning, LLMs. frameworks: React, Node.js, Express, FastAPI. tools / dev: Git, Docker, GitHub Actions, VS Code APIs. systems / web: MQTT, Tailwind CSS, HTML5, REST APIs.</desc>
