<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Jaison Jecinth Vincent cyberpunk profile header</title>
  <desc id="desc">A neon cyberpunk console header with the user's name and developer focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#070b1c"/><stop offset=".55" stop-color="#10143b"/><stop offset="1" stop-color="#230d35"/></linearGradient>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#00f6ff"/><stop offset="1" stop-color="#ff3bd4"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#4c5a9c" stroke-opacity=".2"/></pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <path d="M0 215H1200" stroke="#00f6ff" stroke-opacity=".25"/>
  <path d="M0 217H1200" stroke="#ff3bd4" stroke-opacity=".15" filter="url(#blur)"/>
  <circle cx="1040" cy="-20" r="190" fill="#ff3bd4" opacity=".12" filter="url(#blur)"/>
  <circle cx="130" cy="280" r="180" fill="#00f6ff" opacity=".1" filter="url(#blur)"/>
  <g font-family="monospace">
    <text x="72" y="70" fill="#8b9cff" font-size="18">// IDENTITY_NODE: ONLINE</text>
    <text x="70" y="132" fill="url(#glow)" font-size="48" font-weight="700">JAISON JECINTH VINCENT</text>
    <text x="74" y="174" fill="#d8e7ff" font-size="21">software engineer · AI systems · developer tools</text>
    <text x="74" y="216" fill="#75f7dc" font-size="16">$ connect --profile JaisonJecinthVincent_</text>
  </g>
  <g fill="none" stroke="#00f6ff" stroke-width="2" opacity=".75">
    <path d="M1030 64h90M1075 40v70M1010 91h130"/>
    <circle cx="1075" cy="76" r="40"/>
    <circle cx="1075" cy="76" r="54" stroke-dasharray="4 8"/>
  </g>
</svg>
