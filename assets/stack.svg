<title id="t">Tech stack</title>
<desc id="d">Tech stack. languages: C#, Java, TypeScript, JavaScript, Python. frameworks: .NET, Node.js, FastAPI. databases: PostgreSQL, MS SQL, MySQL, Redis, MongoDB. cloud: AWS, Azure. front-end: React, Next.js, Three.js, Tailwind CSS.</desc>
